{% extends 'base-docentes.html' %} {% load static %} {% block titulo %}Crear
Reunión{% endblock %} {% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card shadow border-0" style="background-color: #e3f2fd">
        <div class="card-body">
          <h2 class="mb-4 text-primary">
            Crear nueva reunión para el track {{ track.nom_track }}
          </h2>
          <form method="post" id="formCrearReunionDocente">
            {% csrf_token %}
            <div class="mb-2">
              <label for="tituloNuevaReunion" class="form-label">Título</label>
              <input
                type="text"
                name="titulo"
                id="tituloNuevaReunion"
                class="form-control"
                maxlength="30"
                pattern="^(?![0-9]+$)[A-Za-zÁÉÍÓÚáéíóúÑñ0-9 ]{1,30}$"
                required
              />
            </div>
            <div class="mb-2">
              <label for="fechaNuevaReunion" class="form-label">Fecha</label>
              <input
                type="date"
                name="fecha"
                id="fechaNuevaReunion"
                class="form-control fecha-reunion"
                required
              />
            </div>
            <div class="mb-2">
              <label for="horaNuevaReunion" class="form-label">Hora</label>
              <input
                type="time"
                name="hora"
                id="horaNuevaReunion"
                class="form-control"
                min="08:00"
                max="23:00"
                required
              />
            </div>
            <div class="mb-2">
              <label for="modalidadNuevaReunion" class="form-label"
                >Modalidad</label
              >
              <select
                name="modalidad"
                id="modalidadNuevaReunion"
                class="form-control modalidad-select"
                data-uid="NuevaReunion"
                required
              >
                <option value="presencial">Presencial</option>
                <option value="virtual">Virtual</option>
              </select>
            </div>
            <div class="mb-2">
              <label for="link_virtualNuevaReunion" class="form-label"
                >Link Virtual</label
              >
              <input
                type="url"
                name="link_virtual"
                id="link_virtualNuevaReunion"
                class="form-control link-virtual-input"
                pattern="https://.*"
                maxlength="200"
                data-uid="NuevaReunion"
              />
            </div>
            <div class="mb-2">
              <label for="ubicacionNuevaReunion" class="form-label"
                >Ubicación</label
              >
              <input
                type="text"
                name="ubicacion"
                id="ubicacionNuevaReunion"
                class="form-control ubicacion-input"
                maxlength="25"
                pattern="^(?![0-9]+$)[A-Za-zÁÉÍÓÚáéíóúÑñ0-9 ,.\-]{1,25}$"
                data-uid="NuevaReunion"
              />
            </div>
            <div class="mb-2">
              <label for="descripcionNuevaReunion" class="form-label"
                >Descripción</label
              >
              <textarea
                name="descripcion"
                id="descripcionNuevaReunion"
                class="form-control"
                maxlength="300"
                pattern="^(?![0-9]+$).{1,300}$"
                required
              ></textarea>
            </div>
            <div class="mt-3 d-flex gap-2 justify-content-center">
              <button type="submit" class="btn btn-success">
                Crear reunión
              </button>
              <a href="{% url 'mi-track' %}" class="btn btn-outline-secondary"
                >Cancelar</a
              >
            </div>
          </form>
          <script src="{% static 'scripts/reuniones.js' %}" defer></script>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
