{% extends 'base-docentes.html' %}
{% load static %}
{% block titulo %}Editar Reunión{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card shadow border-0" style="background-color: #fff3e0;">
        <div class="card-body">
          <h2 class="mb-4 text-warning"><i class="bi bi-pencil-square me-2"></i>Editar reunión</h2>
          <form method="post" class="mt-3" id="formEditarReunionDocente">
            {% csrf_token %}
            <div class="mb-2">
              <label for="tituloEditarReunion" class="form-label">Título</label>
              <input type="text" name="titulo" id="tituloEditarReunion" class="form-control" maxlength="30" pattern="^(?![0-9]+$)[A-Za-zÁÉÍÓÚáéíóúÑñ0-9 ]{1,30}$" value="{{ form.titulo.value|default_if_none:'' }}" required>
            </div>
            <div class="mb-2">
              <label for="fechaEditarReunion" class="form-label">Fecha</label>
              <input type="date" name="fecha" id="fechaEditarReunion" class="form-control fecha-reunion" value="{{ form.fecha.value|default_if_none:'' }}" required>
            </div>
            <div class="mb-2">
              <label for="horaEditarReunion" class="form-label">Hora</label>
              <input type="time" name="hora" id="horaEditarReunion" class="form-control" min="08:00" max="23:00" value="{{ form.hora.value|default_if_none:'' }}" required>
            </div>
            <div class="mb-2">
              <label for="modalidadEditarReunion" class="form-label">Modalidad</label>
              <select name="modalidad" id="modalidadEditarReunion" class="form-control modalidad-select" data-uid="EditarReunion" required>
                <option value="presencial" {% if form.modalidad.value == 'presencial' %}selected{% endif %}>Presencial</option>
                <option value="virtual" {% if form.modalidad.value == 'virtual' %}selected{% endif %}>Virtual</option>
              </select>
            </div>
            <div class="mb-2">
              <label for="link_virtualEditarReunion" class="form-label">Link Virtual</label>
              <input type="url" name="link_virtual" id="link_virtualEditarReunion" class="form-control link-virtual-input" pattern="https://.*" maxlength="200" data-uid="EditarReunion" value="{{ form.link_virtual.value|default_if_none:'' }}">
            </div>
            <div class="mb-2">
              <label for="ubicacionEditarReunion" class="form-label">Ubicación</label>
              <input type="text" name="ubicacion" id="ubicacionEditarReunion" class="form-control ubicacion-input" maxlength="25" pattern="^(?![0-9]+$)[A-Za-zÁÉÍÓÚáéíóúÑñ0-9 ,.\-]{1,25}$" data-uid="EditarReunion" value="{{ form.ubicacion.value|default_if_none:'' }}">
            </div>
            <div class="mb-2">
              <label for="descripcionEditarReunion" class="form-label">Descripción</label>
              <textarea name="descripcion" id="descripcionEditarReunion" class="form-control" maxlength="300" pattern="^(?![0-9]+$).{1,300}$" required>{{ form.descripcion.value|default_if_none:'' }}</textarea>
            </div>
            <div class="mt-4 d-flex gap-2 justify-content-center">
              <button type="submit" class="btn btn-warning text-white">
                <i class="bi bi-save2-fill me-1"></i>Guardar cambios
              </button>
              <a href="{% url 'listar-reuniones-track' %}" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle me-1"></i>Cancelar
              </a>
            </div>
          </form>
          <script src="{% static 'scripts/reuniones.js' %}" defer></script>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
